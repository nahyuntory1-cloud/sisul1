<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서연중학교 시설 고장 접수</title>
<style>
  :root{
    --bg:#fbf7f2; --card:#ffffff; --ink:#2f2a26; --muted:#7a716a; --line:#eadfd4;
    --accent:#e07a5f; --accent-soft:#fdece6; --ok:#3d8b6e; --ok-soft:#e6f3ee;
    --warn:#c9822b; --danger:#c8553d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px}
  header{text-align:center;margin-bottom:20px}
  .logo{width:80px;height:80px;object-fit:contain;border-radius:12px;background:#fff}
  .school{color:var(--accent);font-weight:700;font-size:15px;margin-top:6px}
  h1{font-size:24px;margin:10px 0 4px}
  header p{margin:0;color:var(--muted);font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;
        box-shadow:0 2px 10px rgba(120,90,60,.06)}
  fieldset{border:0;margin:0 0 18px;padding:0}
  legend{font-weight:700;font-size:15px;margin-bottom:10px;padding:0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .full{grid-column:1/-1}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  label .req{color:var(--danger)}
  input,select,textarea{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);
        border-radius:10px;background:#fff;color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
  textarea{min-height:110px;resize:vertical}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chips input{display:none}
  .chips label{margin:0;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:7px 14px;
        font-size:14px;color:var(--ink);background:#fff}
  .chips input:checked + label{background:var(--accent);border-color:var(--accent);color:#fff}
  .agree{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
  .agree input{width:auto;margin-top:3px}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px;cursor:pointer;width:100%}
  .primary{background:var(--accent);color:#fff;font-size:16px}
  .primary:disabled{opacity:.6;cursor:wait}
  .ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .err{color:var(--danger);font-size:13px;margin-top:8px;min-height:18px}
  /* 확인증 */
  #receipt{display:none}
  .done{text-align:center;margin-bottom:16px}
  .done .check{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);
        display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
  .done h2{margin:10px 0 2px;font-size:20px}
  .done p{margin:0;color:var(--muted);font-size:14px}
  .rid{display:block;margin:14px auto 0;font-size:18px;font-weight:700;letter-spacing:.5px;
       background:var(--accent-soft);color:var(--accent);padding:8px 14px;border-radius:10px;width:fit-content}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{width:92px;color:var(--muted);font-weight:500}
  td{white-space:pre-wrap;word-break:break-all}
  .note{font-size:13px;color:var(--muted);margin:14px 0}
  .demo{background:#fff6e5;color:var(--warn);font-size:13px;padding:8px 12px;border-radius:8px;margin-top:12px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px}
  @media (max-width:480px){.grid{grid-template-columns:1fr}}
  @media print{
    body{background:#fff}.btns,footer,header p,.demo{display:none}
    .card{box-shadow:none;border:1px solid #999}
  }
</style>
</head>

    <div class="school">서연중학교</div>
    <h1>시설 고장·수리 접수</h1>
    <p>고장 난 시설을 알려주시면 확인 후 처리하겠습니다.</p>
  </header>

  <!-- 카카오 연결 코드 안내 (카카오 로그인 후 돌아왔을 때만 보임) -->
  <section id="kakaoCode" class="card" style="display:none;margin-bottom:16px;text-align:center">
    <h2 style="margin:0 0 6px;font-size:18px">카카오 연결 코드</h2>
    <p style="margin:0 0 12px;color:var(--muted);font-size:14px">아래 [복사] 버튼을 누르고, 카톡으로 보내주세요.<br>(10분 안에 보내야 해요)</p>
    <div id="kcText" style="word-break:break-all;background:var(--accent-soft);padding:12px;border-radius:10px;font-weight:700;margin-bottom:12px"></div>
    <button class="primary" type="button" id="kcCopy">복사</button>
  </section>

  <!-- 접수 폼 -->
  <form id="form" class="card" novalidate>
    <fieldset>
      <legend>1. 접수자 정보</legend>
      <div class="grid">
        <div><label>이름 <span class="req">*</span></label><input name="name" required maxlength="20" placeholder="홍길동"></div>
        <div><label>연락처(또는 학년·반) <span class="req">*</span></label>
          <input name="phone" required maxlength="30" placeholder="010-0000-0000 / 내선번호 / 2학년 3반"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>2. 고장 위치</legend>
      <div class="grid">
        <div><label>건물 <span class="req">*</span></label>
          <select name="building" required>
            <option value="">선택</option><option>본관</option><option>별관</option>
            <option>체육관</option><option>급식실</option><option>운동장·외부</option><option>기타</option>
          </select></div>
        <div><label>층</label>
          <select name="floor">
            <option value="">선택</option><option>지하</option><option>1층</option><option>2층</option>
            <option>3층</option><option>4층</option><option>5층</option><option>옥상</option>
          </select></div>
        <div class="full"><label>세부 위치 <span class="req">*</span></label>
          <input name="place" required maxlength="50" placeholder="예) 2-3 교실 앞문, 3층 여자화장실 두 번째 칸"></div>
      </div>
    </fieldset>

    <fieldset>
      <legend>3. 고장 내용</legend>
      <label>고장 유형 <span class="req">*</span></label>
      <div class="chips" id="cat">
        <input type="radio" name="category" id="c0" value="누수"><label for="c0">누수</label>
        <input type="radio" name="category" id="c1" value="전기·조명"><label for="c1">전기·조명</label>
        <input type="radio" name="category" id="c2" value="수도·배관"><label for="c2">수도·배관</label>
        <input type="radio" name="category" id="c3" value="냉난방"><label for="c3">냉난방</label>
        <input type="radio" name="category" id="c4" value="문·창문·잠금장치"><label for="c4">문·창문·잠금</label>
        <input type="radio" name="category" id="c5" value="책걸상·비품"><label for="c5">책걸상·비품</label>
        <input type="radio" name="category" id="c7" value="기타"><label for="c7">기타</label>
      </div>
      <label style="margin-top:14px">긴급도 <span class="req">*</span></label>
      <div class="chips">
        <input type="radio" name="urgency" id="u0" value="천천히"><label for="u0">천천히</label>
        <input type="radio" name="urgency" id="u1" value="보통" checked><label for="u1">보통</label>
        <input type="radio" name="urgency" id="u2" value="빠른 처리 필요"><label for="u2">빠른 처리 필요</label>
        <input type="radio" name="urgency" id="u3" value="긴급(안전 위험)"><label for="u3">긴급(안전 위험)</label>
      </div>
      <label style="margin-top:14px">상세 내용 <span class="req">*</span></label>
      <textarea name="detail" required maxlength="1000" placeholder="언제부터, 어떤 증상인지 적어 주세요."></textarea>
    </fieldset>

    <div class="agree"><input type="checkbox" id="agree" required>
      <label for="agree" style="margin:0">시설 처리를 위해 이름·연락처를 수집하는 것에 동의합니다. (처리 완료 후 1년 보관)</label></div>
    <div class="err" id="err"></div>
    <button class="primary" id="submitBtn" type="submit">접수하기</button>
  </form>

  <!-- 확인증 -->
  <section id="receipt" class="card">
    <div class="done">
      <div class="check">✓</div>
      <h2>접수가 완료되었습니다</h2>
      <p>아래 내용으로 접수되었습니다. 접수번호를 보관해 주세요.</p>
      <span class="rid" id="rid"></span>
    </div>
    <table id="summary"></table>
    <p class="note">※ 긴급(안전 위험) 건은 행정실로 바로 전화 주세요.</p>
    <div class="demo" id="demo" style="display:none">시트 미연결(미리보기 모드) — 데이터가 저장되지 않았습니다.</div>
    <div class="btns" style="margin-top:14px">
      <button class="ghost" type="button" onclick="window.print()">확인증 인쇄</button>
      <button class="primary" type="button" onclick="resetForm()">새로 접수</button>
    </div>
  </section>

  <footer>서연중학교 · 시설 고장·수리 접수</footer>
</div>

<script>
  // ▼ Apps Script 웹앱 주소 (이 HTML을 구글 사이트 등 외부에 따로 올릴 때만 입력)
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw39wkp51PVfufyC7dafx-HN1hkGjPO6m8c09oP9lQWafSH_PP_wExyZmCSeZVRMc-j4g/exec';

  // 카카오 로그인 후 돌아오면 주소의 code 값을 크게 보여줌
  (function(){
    const kc = new URLSearchParams(location.search).get('code');
    if(!kc) return;
    document.getElementById('kakaoCode').style.display = 'block';
    document.getElementById('kcText').textContent = kc;
    document.getElementById('kcCopy').onclick = async function(){
      try{ await navigator.clipboard.writeText(kc); this.textContent = '복사됨!'; }
      catch(e){ const r=document.createRange(); r.selectNodeContents(document.getElementById('kcText'));
        const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); document.execCommand('copy'); this.textContent='복사됨!'; }
    };
  })();

  const form = document.getElementById('form');
  const errEl = document.getElementById('err');
  const btn = document.getElementById('submitBtn');

  const LABELS = [['name','이름'],['phone','연락처'],['location','위치'],
                  ['category','고장 유형'],['urgency','긴급도'],['detail','상세 내용'],['time','접수일시']];

  function makeId(d){
    const p = n => String(n).padStart(2,'0');
    const rand = Math.random().toString(36).slice(2,5).toUpperCase();
    return `SY-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}-${rand}`;
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errEl.textContent = '';
    const fd = new FormData(form);
    const data = Object.fromEntries(fd.entries());
    for (const k in data) data[k] = String(data[k]).trim();

    const missing = [];
    if(!data.name) missing.push('이름');
    if(!data.phone) missing.push('연락처'); if(!data.building) missing.push('건물');
    if(!data.place) missing.push('세부 위치'); if(!data.category) missing.push('고장 유형');
    if(!data.detail) missing.push('상세 내용');
    if(missing.length){ errEl.textContent = '다음 항목을 입력해 주세요: ' + missing.join(', '); return; }
    if(!document.getElementById('agree').checked){ errEl.textContent = '개인정보 수집에 동의해 주세요.'; return; }

    const now = new Date();
    data.receiptId = makeId(now);
    btn.disabled = true; btn.textContent = '접수 중...';

    let demo = false;
    try{
      if (window.google && google.script && google.script.run){
        await new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).submitForm(data));
      } else if (SCRIPT_URL){
        await fetch(SCRIPT_URL, {method:'POST', mode:'no-cors',
          headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(data)});
      } else {
        demo = true;
      }
      showReceipt(data, now, demo);
    }catch(err){
      errEl.textContent = '전송에 실패했습니다. 잠시 후 다시 시도해 주세요. (' + (err.message || err) + ')';
    }finally{
      btn.disabled = false; btn.textContent = '접수하기';
    }
  });

  function showReceipt(d, now, demo){
    const view = {...d,
      location: [d.building, d.floor, d.place].filter(Boolean).join(' / '),
      time: now.toLocaleString('ko-KR')};
    const tbl = document.getElementById('summary');
    tbl.innerHTML = '';
    LABELS.forEach(([k, label]) => {
      const tr = tbl.insertRow();
      const th = document.createElement('th'); th.textContent = label; tr.appendChild(th);
      tr.insertCell().textContent = view[k] || '-';
    });
    document.getElementById('rid').textContent = '접수번호 ' + d.receiptId;
    document.getElementById('demo').style.display = demo ? 'block' : 'none';
    form.style.display = 'none';
    document.getElementById('receipt').style.display = 'block';
    window.scrollTo({top:0, behavior:'smooth'});
  }

  function resetForm(){
    form.reset();
    document.getElementById('receipt').style.display = 'none';
    form.style.display = 'block';
    window.scrollTo({top:0});
  }
</script>
</body>
</html>
